<svg width="1200" height="64" viewBox="0 0 1200 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Signal verified, system shipping</title>
  <defs>
    <linearGradient id="line" x1="20" y1="32" x2="1180" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#FF2BD6" stop-opacity="0"/><stop offset=".25" stop-color="#FF2BD6"/><stop offset=".5" stop-color="#7C3AED"/><stop offset=".75" stop-color="#00E5FF"/><stop offset="1" stop-color="#3DFF8F" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
