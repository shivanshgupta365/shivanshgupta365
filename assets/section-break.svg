  <circle class="blink" cx="505" cy="32" r="4" fill="#3DFF8F"/>
  <text x="520" y="36" fill="#A7B7C8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.6">SIGNAL VERIFIED // SHIP</text>
</svg>
