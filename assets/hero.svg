<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shivansh Gupta — building AI systems that survive the demo</title>
  <desc id="desc">Animated cyberpunk mission-control display for an AI systems and product engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="32" y1="12" x2="1174" y2="404" gradientUnits="userSpaceOnUse">
      <stop stop-color="#02030A"/>
      <stop offset=".46" stop-color="#08051B"/>
      <stop offset="1" stop-color="#03161A"/>
    </linearGradient>
    <linearGradient id="neon" x1="92" y1="93" x2="1100" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2BD6"/>
      <stop offset=".42" stop-color="#7C3AED"/>
      <stop offset=".7" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#3DFF8F"/>
    </linearGradient>
    <linearGradient id="scanGradient" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#00E5FF" stop-opacity=".8"/>
      <stop offset=".52" stop-color="#FF2BD6" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="0" cy="0" r="1" gradientTransform="translate(1016 210) rotate(90) scale(176)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity=".18"/>
      <stop offset=".54" stop-color="#7C3AED" stop-opacity=".08"/>
      <stop offset="1" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#00E5FF" stroke-opacity=".055"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H1200" stroke="#FFFFFF" stroke-opacity=".025"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="1160" height="380" rx="24"/></clipPath>
    <clipPath id="glitchTop"><rect x="55" y="130" width="810" height="32"/></clipPath>
    <clipPath id="glitchBottom"><rect x="55" y="203" width="810" height="35"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .dash { stroke-dasharray: 10 12; animation: dash 12s linear infinite; }
      .dash-reverse { stroke-dasharray: 3 10; animation: dashReverse 9s linear infinite; }
      .pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse-late { animation: pulse 2.2s .8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .scan { animation: scan 5.2s ease-in-out infinite; }
      .glitch-cyan { opacity: 0; animation: glitchCyan 5s steps(1, end) infinite; }
      .glitch-pink { opacity: 0; animation: glitchPink 5s steps(1, end) infinite; }
      .blink { animation: blink 1.1s steps(2, jump-none) infinite; }
      .radar { animation: rotate 14s linear infinite; transform-origin: 1016px 210px; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes dashReverse { to { stroke-dashoffset: 180; } }
      @keyframes pulse { 0%, 100% { opacity: .38; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.14); } }
      @keyframes scan { 0%, 100% { transform: translateY(-54px); opacity: 0; } 13%, 88% { opacity: .72; } 50% { transform: translateY(410px); } }
      @keyframes blink { 50% { opacity: .18; } }
      @keyframes rotate { to { transform: rotate(360deg); } }
      @keyframes glitchCyan { 0%, 84%, 100% { transform: translate(0); opacity: 0; } 85% { transform: translate(-8px, 1px); opacity: .78; } 87% { transform: translate(5px, -1px); opacity: .42; } 89% { opacity: 0; } }
      @keyframes glitchPink { 0%, 86%, 100% { transform: translate(0); opacity: 0; } 87% { transform: translate(9px, -1px); opacity: .72; } 89% { transform: translate(-4px, 1px); opacity: .38; } 91% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .dash, .dash-reverse, .pulse, .pulse-late, .scan, .glitch-cyan, .glitch-pink, .blink, .radar { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="1160" height="380" fill="url(#grid)"/>
    <rect x="20" y="20" width="1160" height="380" fill="url(#scanlines)"/>
    <circle cx="1016" cy="210" r="176" fill="url(#radarGlow)"/>
    <path class="scan" d="M20 28H1180" stroke="url(#scanGradient)" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M20 101H160L181 80H493" stroke="#FF2BD6" stroke-opacity=".34"/>
    <path d="M692 365H950L978 337H1180" stroke="#00E5FF" stroke-opacity=".32"/>
    <path class="dash" d="M779 178C838 74 981 39 1092 102C1153 136 1175 209 1188 270" stroke="url(#neon)" stroke-width="2" stroke-opacity=".72"/>
    <path class="dash-reverse" d="M786 246C873 342 1036 354 1140 261" stroke="#3DFF8F" stroke-opacity=".38"/>
  </g>

  <rect x="20.75" y="20.75" width="1158.5" height="378.5" rx="23.25" stroke="url(#neon)" stroke-opacity=".62" stroke-width="1.5"/>
  <path d="M50 20H190" stroke="#FF2BD6" stroke-width="3"/>
  <path d="M1011 400H1150" stroke="#00E5FF" stroke-width="3"/>

  <g class="mono" font-size="11" letter-spacing="1.8">
    <circle class="pulse" cx="56" cy="55" r="5" fill="#3DFF8F" filter="url(#glow)"/>
    <text x="72" y="59" fill="#9BFFC1">OPERATOR ONLINE</text>
    <text x="228" y="59" fill="#52677C">//</text>
    <text x="253" y="59" fill="#8EA4BA">BLR NODE 12.9716 N</text>
    <text x="1020" y="59" fill="#8EA4BA">SG-365</text>
  </g>

  <g class="sans">
    <text x="60" y="117" fill="#8EA4BA" font-size="15" font-weight="700" letter-spacing="5">FOUNDER-MINDED ENGINEER // SYSTEMS BUILDER</text>
    <text x="55" y="194" fill="url(#neon)" font-size="68" font-weight="900" letter-spacing="-2">SHIVANSH GUPTA</text>
    <text class="glitch-cyan" clip-path="url(#glitchTop)" x="50" y="194" fill="#00E5FF" font-size="68" font-weight="900" letter-spacing="-2">SHIVANSH GUPTA</text>
    <text class="glitch-pink" clip-path="url(#glitchBottom)" x="61" y="194" fill="#FF2BD6" font-size="68" font-weight="900" letter-spacing="-2">SHIVANSH GUPTA</text>
    <text x="60" y="238" fill="#EEF7FF" font-size="21" font-weight="650" letter-spacing="2.4">ENGINEERING SYSTEMS THAT SURVIVE THE DEMO.</text>
  </g>

  <g class="mono" font-size="11" letter-spacing="1.2">
    <rect x="60" y="278" width="190" height="34" rx="7" fill="#FF2BD6" fill-opacity=".08" stroke="#FF2BD6" stroke-opacity=".7"/>
    <text x="80" y="299" fill="#FF9BEA">AI RUNTIME CONTROL</text>
    <rect x="262" y="278" width="174" height="34" rx="7" fill="#7C3AED" fill-opacity=".11" stroke="#7C3AED" stroke-opacity=".72"/>
    <text x="283" y="299" fill="#C4B5FD">AGENT SYSTEMS</text>
    <rect x="448" y="278" width="178" height="34" rx="7" fill="#00E5FF" fill-opacity=".08" stroke="#00E5FF" stroke-opacity=".64"/>
    <text x="470" y="299" fill="#9AF5FF">PRODUCT + OPS</text>
    <rect x="638" y="278" width="165" height="34" rx="7" fill="#3DFF8F" fill-opacity=".07" stroke="#3DFF8F" stroke-opacity=".58"/>
    <text x="662" y="299" fill="#A7F3D0">OPEN SOURCE</text>
  </g>

  <g transform="translate(1016 210)">
    <circle r="111" stroke="#00E5FF" stroke-opacity=".16"/>
    <circle class="dash" r="89" stroke="url(#neon)" stroke-width="2" stroke-opacity=".86"/>
    <circle class="dash-reverse" r="61" stroke="#FF2BD6" stroke-opacity=".6"/>
    <g class="radar">
      <path d="M0 0L78 -35A86 86 0 0 1 84 17Z" fill="#00E5FF" fill-opacity=".08"/>
      <path d="M0 -88V88M-88 0H88" stroke="#00E5FF" stroke-opacity=".18"/>
    </g>
    <circle class="pulse" cx="49" cy="-48" r="6" fill="#FF2BD6" filter="url(#glow)"/>
    <circle class="pulse-late" cx="-57" cy="34" r="5" fill="#3DFF8F" filter="url(#glow)"/>
    <circle r="8" fill="#00E5FF" filter="url(#glow)"/>
    <path d="M-22 0H22M0-22V22" stroke="#D8FBFF" stroke-opacity=".7"/>
    <text class="mono" x="-59" y="136" fill="#7B91A6" font-size="10" letter-spacing="2">SIGNAL VERIFIED</text>
  </g>

  <g class="mono" font-size="10" fill="#597086">
    <text x="42" y="386">FRAME // COMMAND DECK</text>
    <text x="547" y="386" fill="#00E5FF">BUILD</text>
    <text x="583" y="386"> → </text>
    <text x="604" y="386" fill="#FF2BD6">VERIFY</text>
    <text x="647" y="386"> → </text>
    <text x="668" y="386" fill="#3DFF8F">SHIP</text>
    <text class="blink" x="1153" y="386" fill="#00E5FF">▮</text>
  </g>
</svg>
